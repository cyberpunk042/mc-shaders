# Test classes in this module share one JVM and one set of statics, and
# McShadersAPI's registration phase closes exactly once and never reopens.
# DimensionApiTest closes it on purpose (that is the behaviour it asserts), so any
# class that needs to register a binding has to run before it — and without an
# explicit order, which runs first is unspecified.
#
# BindingLayeringTest is that class: its whole subject is what a datapack reload
# does to bindings registered in Java, so an empty registered set makes every one
# of its assertions vacuously true. It carries @Order(1). Classes with no @Order
# sort after it and keep their relative order, so this pins one thing and leaves
# the rest alone.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation

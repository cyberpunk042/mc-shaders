# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for every external version.
#
# VERIFICATION STATUS: the values below were gathered from public release notes
# and registries (see docs/VERSIONS.md for the per-value source). They have NOT
# been resolved against live Maven in this environment, because every Minecraft
# Maven host is unreachable from it. The first networked CI run pins them.
# Treat a resolution failure here as "bump the number", not "the build is wrong".
# ─────────────────────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Loom and IntelliJ still disagree about the configuration cache.
org.gradle.configuration-cache=false

# ── Mod identity ────────────────────────────────────────────────────────────
mod_id=mcshaders
mod_name=MC Shaders
mod_version=0.2.0
# The core is versioned separately because it is a standalone build that can be
# consumed on its own. This value must equal core/gradle.properties, and
# settings.gradle.kts fails the build if it does not — a comment asking a human to
# keep two declarations in step is the drift this project's own tooling exists to
# catch.
core_version=0.2.0
mod_license=MIT
mod_group=net.cyberpunk042
mod_authors=cyberpunk042
mod_description=A dimension-aware shader effect framework for Minecraft.

# ── Toolchain ───────────────────────────────────────────────────────────────
# Minecraft 26.1 raised the floor to Java 25 for the Gradle JVM.
java_version=25
gradle_version=9.5.1

# ── Gradle plugins ──────────────────────────────────────────────────────────
# 1.17 does not exist under this plugin id — CI: "could not resolve plugin
# artifact net.fabricmc.fabric-loom:...:1.17", though Fabric's 26.2 announcement
# names Loom 1.17. `1.16-SNAPSHOT` (what Snownee/Jade ships on) resolved to
# 1.16.3 on a runner, and that is pinned here: a snapshot is not a pin.
fabric_loom_version=1.16.3
moddevgradle_version=2.0.141

# ── Minecraft: 26.2 (current stable, "Chaos Cubed", 2026-06-16) ─────────────
mc_26_2_minecraft=26.2
mc_26_2_fabric_loader=0.19.3
mc_26_2_fabric_api=0.157.0+26.2
mc_26_2_neoforge=26.2.0.35-beta
# NeoForm gives the `vanilla` module Minecraft with no loader attached. Read out
# of NeoForge 26.2.x's own build, which consumes `net.neoforged:neoform:${minecraft_version}-${neoform_version}`
# with minecraft_version=26.2 and neoform_version=2.
mc_26_2_neoform=26.2-2

# ── Minecraft: 26.3 (upcoming, in snapshots as of 2026-08) ──────────────────
# Deliberately inert until 26.3 ships. Retarget via mc_version below; the
# loader coordinates are placeholders and MUST be pinned at that point.
mc_26_3_minecraft=26.3
mc_26_3_fabric_loader=0.18.4
mc_26_3_fabric_api=PIN_ON_RELEASE
mc_26_3_neoforge=PIN_ON_RELEASE
mc_26_3_neoform=PIN_ON_RELEASE

# The Minecraft version this build targets. The loader subprojects look their
# coordinates up as mc_<version>_* from the keys above, so retargeting is this one
# line plus a pinned set of loader versions — no build script edits.
mc_version=26.2

name: CI

# Feature branches are covered by their pull request; pushing to a branch that
# has one would otherwise run the whole matrix twice for the same commit.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The framework core: pure Java, no Minecraft, nothing beyond Maven Central.
  # Authoritative — it must stay green.
  # ───────────────────────────────────────────────────────────────────────────
  core:
    name: Core (pure Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The core is a separate build, so it runs from its own directory using the
      # repository's single pinned wrapper.
      - name: Test
        working-directory: core
        run: ../gradlew test --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/build/test-results/test/*.xml
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # The shader-pack checker: also pure Java, and also its own build, so that a
  # pack can be validated without the game or a GPU. Authoritative.
  # ───────────────────────────────────────────────────────────────────────────
  check:
    name: Checker (pure Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        working-directory: check
        run: ../gradlew test --console=plain

      # Dogfooding: the checker is run over this repository's own resources. It
      # passes vacuously while there are none, and starts guarding them the moment
      # any are added — which is the point of wiring it up before there are.
      - name: Check this repository's own shader resources
        working-directory: check
        run: |
          for tree in ../common/src/main/resources/assets ../fabric/src/main/resources/assets; do
            if [ -d "$tree" ]; then
              echo "checking $tree"
              ../gradlew run --args="$tree" --console=plain -q
            fi
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-test-results
          path: check/build/test-results/test/*.xml
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # The shared Minecraft-facing module. It depends only on the core and Maven
  # Central — no Minecraft Maven — so it is also authoritative. This is what
  # proves the composite substitution and the JDK 25 toolchain actually work.
  # ───────────────────────────────────────────────────────────────────────────
  common:
    name: Common (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :common:build --configure-on-demand --console=plain

  # ───────────────────────────────────────────────────────────────────────────
  # The loader modules — the only part that needs the Minecraft Maven hosts.
  #
  # This job was advisory while the version table was unverified, since nothing
  # in it could be resolved in the environment that bootstrapped the repository.
  # It went green on 2026-08-21 (13 tasks, Fabric and NeoForge jars built against
  # Minecraft 26.2), which pinned every coordinate in gradle.properties, so it is
  # now blocking like the rest.
  # ───────────────────────────────────────────────────────────────────────────
  loaders:
    name: Fabric + NeoForge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain

  # ───────────────────────────────────────────────────────────────────────────
  # Publish the library artifacts to GitHub Packages.
  #
  # Runs only on a published release, and only after every check is green — an
  # artifact that nobody can build from is worse than no artifact.
  #
  # Two coordinates are published:
  #   net.cyberpunk042:mcshaders-core  the pure-Java framework, usable off Minecraft
  #   net.cyberpunk042:mcshaders-api   what other mods compile against
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to GitHub Packages
    if: github.event_name == 'release'
    needs: [core, common, loaders]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish core
        working-directory: core
        run: ../gradlew publish --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API
        run: ./gradlew :common:publish --configure-on-demand --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
